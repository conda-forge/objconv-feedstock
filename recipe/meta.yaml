{% set name = "objconv" %}
{% set version = "2.56" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/staticfloat/objconv/archive/v{{ version }}.tar.gz
  sha256: d93e99619612efb4b11303f951d37faa56b6af571e5be9d6ccb9030dccc4991f

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - make

test:
  commands:
    - objconv -h

about:
  home: https://www.agner.org/optimize/#objconv
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: 'Object file converter'

extra:
  recipe-maintainers:
    - isuruf
    - ngam
